<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio · Stockdash</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/portfolio.css" />
</head>
<body>

<nav class="db-nav">
  <a class="db-brand" href="/">◈ STOCKDASH</a>
  <div class="db-nav-right">
    <a href="/" class="btn btn-secondary sm">AI Research</a>
    <a href="/dashboard" class="btn btn-secondary sm">Dashboard</a>
    <span class="btn btn-secondary sm db-nav-current">Portfolio</span>
    {% if current_user %}
      <span class="nav-user">{{ current_user }}</span>
      <a href="/logout" class="btn btn-secondary sm">Logout</a>
    {% endif %}
  </div>
</nav>

<div class="port-layout">

  <!-- ① Performance chart -->
  <div class="port-perf-card">
    <div class="port-perf-header">
      <div class="port-perf-meta">
        <div class="port-perf-value" id="portTotalValue">—</div>
        <div class="port-perf-chg"   id="portPeriodChg"></div>
      </div>
      <div class="port-period-btns" id="portPeriodBtns">
        <button class="port-period-btn"        data-period="1d">1D</button>
        <button class="port-period-btn"        data-period="5d">5D</button>
        <button class="port-period-btn"        data-period="1mo">1M</button>
        <button class="port-period-btn active" data-period="3mo">3M</button>
        <button class="port-period-btn"        data-period="6mo">6M</button>
        <button class="port-period-btn"        data-period="1y">1Y</button>
      </div>
    </div>
    <div class="port-chart-area">
      <canvas id="lineChart"></canvas>
      <div class="port-chart-empty" id="portChartEmpty">Add holdings below to track your portfolio</div>
    </div>
  </div>

  <!-- ② Stats -->
  <div class="port-stats-row" id="portStats" style="display:none"></div>

  <!-- ③ Holdings card -->
  <div class="port-holdings-card">
    <div class="port-holdings-hdr">
      <div class="port-holdings-left">
        <span class="port-holdings-title">Holdings</span>
        <span class="port-price-stamp" id="priceStamp"></span>
      </div>
      <div class="port-holdings-btns">
        <button class="btn btn-secondary sm" id="addToggleBtn" onclick="toggleAddForm()">+ Add</button>
        <button class="btn btn-secondary sm" onclick="document.getElementById('importFile').click()">↑ Import</button>
        <input type="file" id="importFile" accept=".csv,.json" style="display:none" />
      </div>
    </div>

    <!-- Collapsible add form -->
    <div class="port-add-form" id="portAddForm" style="display:none">
      <div class="port-add-row">
        <div class="port-ticker-wrap">
          <input class="port-input port-ticker-input" id="tickerInput"
                 placeholder="Ticker (e.g. AAPL)" autocomplete="off" />
          <div class="search-dropdown" id="tickerDropdown"></div>
        </div>
        <input class="port-input port-shares-input" id="sharesInput"
               type="number" placeholder="Shares" min="0.001" step="any" />
        <input class="port-input port-buyin-input" id="buyinInput"
               type="number" placeholder="Avg cost" min="0" step="any" />
        <button class="btn btn-primary sm" onclick="addHolding()">Add</button>
      </div>
      <div id="importMsg" style="font-size:12px;margin-top:4px;display:none"></div>
    </div>

    <div id="holdingsTable"></div>
  </div>

  <!-- ④ AI analysis -->
  <div class="port-ai-row" id="portAiRow" style="display:none">
    <button class="btn btn-primary" id="analyzeBtn" onclick="analyzePortfolio()">
      ✦ AI Portfolio Analysis →
    </button>
  </div>

  <div id="portAnalysis" style="display:none">
    <div class="port-card">
      <div class="port-analysis-top">
        <div class="port-alloc-col">
          <div class="port-card-label">Allocation</div>
          <div id="allocTable"></div>
        </div>
        <div class="port-verdict-col">
          <div class="port-card-label">AI Verdict</div>
          <div class="port-analysis-body" id="analysisBody"></div>
        </div>
      </div>
    </div>
    <div id="stockAnalyses"></div>
  </div>

</div>

<div class="port-loading" id="portLoading" style="display:none">
  <div class="port-spinner"></div>
  <span>Running AI analysis…</span>
</div>

<script>window.CURRENT_USER = "{{ current_user or '' }}";</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/portfolio.js"></script>
</body>
</html>
