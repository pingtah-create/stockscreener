<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Analysis</title>
  <link rel="stylesheet" href="/static/portfolio.css" />
</head>
<body>

<nav class="port-nav">
  <a class="port-brand" href="/dashboard">◈ STOCKDASH</a>
  <span class="port-nav-title">Portfolio</span>
  <div class="port-nav-right">
    <a href="/" class="port-nav-link">Chat</a>
    <a href="/dashboard" class="port-nav-link">Dashboard</a>
    {% if current_user %}
      <span class="port-nav-user">{{ current_user }}</span>
      <a href="/logout" class="port-nav-link">Logout</a>
    {% endif %}
  </div>
</nav>

<div class="port-layout">

  <!-- Holdings input -->
  <div class="port-input-card">
    <div class="port-card-label">Holdings</div>
    <div class="port-add-row">
      <input class="port-input port-ticker-input" id="tickerInput"
             placeholder="Ticker (e.g. AAPL)" autocomplete="off" />
      <input class="port-input port-shares-input" id="sharesInput"
             type="number" placeholder="Shares" min="0.001" step="any" />
      <input class="port-input port-buyin-input" id="buyinInput"
             type="number" placeholder="Buy price" min="0" step="any" />
      <button class="port-add-btn" onclick="addHolding()">+ Add</button>
    </div>
    <div class="port-pills" id="holdingsList"></div>
    <div class="port-actions-row">
      <div class="port-period-btns">
        <button class="port-period-btn" data-period="1mo">1M</button>
        <button class="port-period-btn active" data-period="3mo">3M</button>
        <button class="port-period-btn" data-period="6mo">6M</button>
        <button class="port-period-btn" data-period="1y">1Y</button>
      </div>
      <button class="port-analyze-btn" id="analyzeBtn" onclick="analyzePortfolio()">
        Analyze Portfolio →
      </button>
    </div>
  </div>

  <!-- Results (hidden until first analysis) -->
  <div id="portResults" style="display:none">

    <!-- Stats row -->
    <div class="port-stats-row" id="portStats"></div>

    <!-- Charts -->
    <div class="port-charts-row">
      <div class="port-card">
        <div class="port-card-label">Performance vs S&amp;P 500</div>
        <canvas id="lineChart" height="160"></canvas>
      </div>
      <div class="port-card">
        <div class="port-card-label">Allocation</div>
        <div class="port-donut-wrap">
          <canvas id="donutChart" width="140" height="140"></canvas>
          <div class="port-donut-legend" id="donutLegend"></div>
        </div>
      </div>
    </div>

    <!-- Holdings table -->
    <div class="port-card">
      <div class="port-card-label">Positions</div>
      <div id="holdingsTable"></div>
    </div>

    <!-- AI analysis -->
    <div class="port-card">
      <div class="port-card-label">AI Analysis</div>
      <div class="port-analysis-body" id="analysisBody"></div>
    </div>

  </div>
</div>

<!-- Loading overlay -->
<div class="port-loading" id="portLoading" style="display:none">
  <div class="port-spinner"></div>
  <span>Fetching prices &amp; analysing…</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/portfolio.js"></script>
</body>
</html>
