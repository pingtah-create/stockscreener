<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio · Stockdash</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/portfolio.css" />
</head>
<body>

<nav class="db-nav">
  <a class="db-brand" href="/dashboard">◈ STOCKDASH</a>
  <span class="db-nav-sep">·</span>
  <span class="db-nav-page">Portfolio</span>
  <div class="db-nav-right">
    <a href="/" class="btn btn-secondary sm">Chat</a>
    <a href="/dashboard" class="btn btn-secondary sm">Dashboard</a>
    {% if current_user %}
      <span class="nav-user">{{ current_user }}</span>
      <a href="/logout" class="btn btn-secondary sm">Logout</a>
    {% endif %}
  </div>
</nav>

<div class="port-layout">

  <!-- Holdings input -->
  <div class="port-input-card">
    <div class="port-card-label">Holdings</div>
    <div class="port-add-row">
      <input class="port-input port-ticker-input" id="tickerInput"
             placeholder="Ticker (e.g. AAPL)" autocomplete="off" />
      <input class="port-input port-shares-input" id="sharesInput"
             type="number" placeholder="Shares" min="0.001" step="any" />
      <input class="port-input port-buyin-input" id="buyinInput"
             type="number" placeholder="Buy price" min="0" step="any" />
      <button class="btn btn-secondary" onclick="addHolding()">+ Add</button>
    </div>
    <div class="port-pills" id="holdingsList"></div>
  </div>

  <!-- Live summary — auto-loaded whenever holdings exist -->
  <div id="portSummary" style="display:none">

    <!-- Stats -->
    <div class="port-stats-row" id="portStats"></div>

    <!-- Holdings table -->
    <div class="port-card">
      <div class="port-card-label" style="display:flex;align-items:center;justify-content:space-between">
        <span>Positions</span>
        <span id="priceStamp" style="font-weight:400;color:var(--text3);text-transform:none;letter-spacing:0"></span>
      </div>
      <div id="holdingsTable"></div>
    </div>

    <!-- Analyse deeper -->
    <div class="port-analyze-row">
      <div class="port-period-btns">
        <button class="port-period-btn" data-period="1mo">1M</button>
        <button class="port-period-btn active" data-period="3mo">3M</button>
        <button class="port-period-btn" data-period="6mo">6M</button>
        <button class="port-period-btn" data-period="1y">1Y</button>
      </div>
      <button class="btn btn-primary" id="analyzeBtn" onclick="analyzePortfolio()" style="padding:8px 22px;font-size:13px">
        Run Full Analysis →
      </button>
    </div>

  </div>

  <!-- Deep analysis — only shown after Run Full Analysis -->
  <div id="portAnalysis" style="display:none">

    <div class="port-charts-row">
      <div class="port-card">
        <div class="port-card-label">Performance vs S&amp;P 500</div>
        <canvas id="lineChart" height="160"></canvas>
      </div>
      <div class="port-card">
        <div class="port-card-label">Allocation</div>
        <div class="port-donut-wrap">
          <canvas id="donutChart" width="140" height="140"></canvas>
          <div class="port-donut-legend" id="donutLegend"></div>
        </div>
      </div>
    </div>

    <div class="port-card">
      <div class="port-card-label">AI Analysis</div>
      <div class="port-analysis-body" id="analysisBody"></div>
    </div>

  </div>

</div>

<!-- Loading overlay (for full analysis only) -->
<div class="port-loading" id="portLoading" style="display:none">
  <div class="port-spinner"></div>
  <span>Fetching historical data &amp; running AI analysis…</span>
</div>

<script>window.CURRENT_USER = "{{ current_user or '' }}";</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/portfolio.js"></script>
</body>
</html>
