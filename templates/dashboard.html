<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Map</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- TOPBAR -->
<nav class="db-nav">
  <a class="db-brand" href="/dashboard">◈ STOCKDASH</a>

  <div class="db-indices">
    <span class="db-idx" id="mktcard-SP500">
      <span class="db-idx-name">S&amp;P</span>
      <span id="mktprice-SP500">—</span>
      <span class="mkt-card-chg" id="mktchg-SP500">—</span>
    </span>
    <span class="db-idx-sep">·</span>
    <span class="db-idx" id="mktcard-NASDAQ">
      <span class="db-idx-name">NDX</span>
      <span id="mktprice-NASDAQ">—</span>
      <span class="mkt-card-chg" id="mktchg-NASDAQ">—</span>
    </span>
    <span class="db-idx-sep">·</span>
    <span class="db-idx" id="mktcard-DOW">
      <span class="db-idx-name">DOW</span>
      <span id="mktprice-DOW">—</span>
      <span class="mkt-card-chg" id="mktchg-DOW">—</span>
    </span>
    <span class="db-idx-sep">·</span>
    <span class="db-idx" id="mktcard-Russell">
      <span class="db-idx-name">RUT</span>
      <span id="mktprice-Russell">—</span>
      <span class="mkt-card-chg" id="mktchg-Russell">—</span>
    </span>
    <span class="db-idx-sep">·</span>
    <span class="db-idx" id="mktcard-VIX">
      <span class="db-idx-name">VIX</span>
      <span id="mktprice-VIX">—</span>
      <span class="mkt-card-chg" id="mktchg-VIX">—</span>
    </span>
    <span class="db-idx-sep">·</span>
    <span class="db-idx" id="mktcard-10Y">
      <span class="db-idx-name">10Y</span>
      <span id="mktprice-10Y">—</span>
      <span class="mkt-card-chg" id="mktchg-10Y">—</span>
    </span>
  </div>

  <div class="db-search-wrap" id="searchWrap">
    <span class="db-search-icon">⌕</span>
    <input class="db-search-input" id="searchInput" type="text"
           placeholder="Search…  Ctrl+K" autocomplete="off" />
    <div class="search-dropdown" id="searchDropdown"></div>
  </div>

  <div class="db-nav-right">
    <span class="market-status" id="marketStatus">
      <span class="market-dot" id="marketDot"></span>
      <span class="market-label" id="marketLabel">—</span>
    </span>
    <a href="/" class="btn btn-secondary sm">← Chat</a>
    {% if current_user %}
      <span class="nav-user">{{ current_user }}</span>
      <a href="/logout" class="btn btn-secondary sm">Logout</a>
    {% endif %}
  </div>
</nav>

<!-- BODY -->
<div class="db-body">

  <!-- STOCK MAP -->
  <div class="db-map-wrap">
    <div class="db-map-bar">
      <span class="db-section-title">MARKET MAP</span>
      <div class="db-map-controls">
        <div class="stockmap-legend">
          <span class="sm-legend-label">−5%</span>
          <span class="sm-legend-bar"></span>
          <span class="sm-legend-label">0</span>
          <span class="sm-legend-bar sm-legend-bar-pos"></span>
          <span class="sm-legend-label">+5%</span>
        </div>
        <select class="stockmap-filter" id="stockmapSector" title="Filter by sector">
          <option value="">All sectors</option>
        </select>
        <button class="db-icon-btn" onclick="loadStockMap()" title="Refresh map">⟳</button>
      </div>
    </div>
    <div class="stockmap-wrap" id="stockMap">
      <div class="news-loading"><span class="spinner"></span> Loading map…</div>
    </div>
  </div>

  <!-- WATCHLIST SIDEBAR -->
  <aside class="db-sidebar">
    <div class="db-sidebar-header">
      <span class="db-section-title">WATCHLIST</span>
      <button class="watchlist-add-btn" id="watchlistAddBtn" title="Add ticker">+</button>
    </div>
    <div class="watchlist-input-wrap" id="watchlistInputWrap" style="display:none">
      <input class="watchlist-input" id="watchlistInput" type="text"
             placeholder="AAPL, 2330.TW…" autocomplete="off" />
    </div>
    <div class="watchlist-list" id="watchlistList">
      <div class="watchlist-empty">No stocks. Click + to add.</div>
    </div>
  </aside>

</div>

<script src="/static/stock-map.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
